<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZABI PRO CALC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center}
.calc{background:rgba(255,255,255,0.2);backdrop-filter:blur(20px);padding:25px;border-radius:30px;box-shadow:0 20px 40px rgba(0,0,0,0.3);width:330px;border:1px solid rgba(255,255,255,0.4)}
h2{text-align:center;color:white;margin-bottom:15px;letter-spacing:2px}
#result{width:100%;height:70px;font-size:32px;text-align:right;padding:15px;border:none;border-radius:15px;background:rgba(0,0,0,0.35);color:white;margin-bottom:20px;outline:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{height:60px;font-size:22px;border:none;border-radius:14px;font-weight:bold;cursor:pointer;transition:0.15s}
.num{background:white;color:#333}
.op{background:#ffb700;color:white}
.eq{background:#2ecc71;color:white}
.clear{background:#ff3b30;color:white}
button:active{transform:scale(0.92)}
</style>
</head>
<body>
<div class="calc">
<h2>ZABI CALC</h2>
<input id="result" readonly placeholder="0">
<div class="grid">
<button class="clear" onclick="clearR()">C</button>
<button class="op" onclick="add('/')">÷</button>
<button class="op" onclick="add('*')">×</button>
<button class="op" onclick="add('-')">−</button>

<button class="num" onclick="add('7')">7</button>
<button class="num" onclick="add('8')">8</button>
<button class="num" onclick="add('9')">9</button>
<button class="op" onclick="add('+')">+</button>

<button class="num" onclick="add('4')">4</button>
<button class="num" onclick="add('5')">5</button>
<button class="num" onclick="add('6')">6</button>
<button class="num" onclick="add('1')">1</button>

<button class="num" onclick="add('2')">2</button>
<button class="num" onclick="add('3')">3</button>
<button class="num" onclick="add('0')">0</button>
<button class="num" onclick="add('.')">.</button>

<button class="eq" onclick="calc()" style="grid-column:span 4">=</button>
</div>
</div>
<script>
let r=document.getElementById('result');
function add(v){if(r.value=='Error')r.value='';r.value+=v}
function clearR(){r.value=''}
function calc(){try{r.value=eval(r.value)}catch{r.value='Error'}}
</script>
</body>
</html>
