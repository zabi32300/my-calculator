<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z CALC DEG - Made by Zohaib</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#121212;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}
.badge{position:fixed;top:12px;right:12px;background:#FFC107;color:#000;font-size:10px;padding:8px 14px;border-radius:20px;z-index:10000;font-weight:800}
#welcome{position:fixed;inset:0;background:#121212;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;animation:hideW 0.8s ease 2.8s forwards}
#welcome h1{font-size:2.5rem;color:#FFC107;text-align:center}
#welcome p{color:#fff;margin-top:12px;letter-spacing:3px;font-size:12px;font-weight:800}
#welcome .load{margin-top:20px;width:100px;height:3px;background:#333;border-radius:10px;overflow:hidden}
#welcome .load div{height:100%;width:0%;background:#FFC107;animation:load 2.5s ease forwards}
@keyframes load{to{width:100%}} @keyframes hideW{to{transform:translateY(-100%);opacity:0;visibility:hidden}}
.calc{width:100%;max-width:360px;background:#2D2D2D;padding:18px;border-radius:24px;border:1px solid #3A3A3A}
.top{display:flex;justify-content:space-between;margin-bottom:15px}
.top h2{color:#FFC107;font-size:18px}
.display{background:#1A1A1A;padding:14px 16px;border-radius:14px;min-height:80px;text-align:right}
.display .expr{color:#888;font-size:13px;min-height:18px}
.display .res{color:#FFF;font-size:32px;font-weight:800;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.grid button{height:56px;border:none;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer}
.btn-c{background:#3A3A3A;color:#FFC107} .btn-op{background:#3A3A3A;color:#FFC107}
.btn-num{background:#4A4A4A;color:#FFF} .btn-func{background:#4A4A4A;color:#FFC107;font-size:15px}
.btn-eq{background:#FFC107;color:#000;font-size:22px}
</style>
</head>
<body>
<div class="badge">MADE BY ZOHAIB</div>
<div id="welcome"><h1>Z CALC DEG</h1><p>MADE BY ZOHAIB</p><div class="load"><div></div></div></div>
<div class="calc">
<div class="top"><h2>Z CALC DEG</h2></div>
<div class="display"><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
<div class="grid">
<button class="btn-c" onclick="clearAll()">C</button>
<button class="btn-c" onclick="del()">⌫</button>
<button class="btn-op" onclick="append('%')">%</button>
<button class="btn-op" onclick="append('/')">÷</button>
<button class="btn-num" onclick="append('7')">7</button>
<button class="btn-num" onclick="append('8')">8</button>
<button class="btn-num" onclick="append('9')">9</button>
<button class="btn-op" onclick="append('*')">×</button>
<button class="btn-num" onclick="append('4')">4</button>
<button class="btn-num" onclick="append('5')">5</button>
<button class="btn-num" onclick="append('6')">6</button>
<button class="btn-op" onclick="append('-')">-</button>
<button class="btn-num" onclick="append('1')">1</button>
<button class="btn-num" onclick="append('2')">2</button>
<button class="btn-num" onclick="append('3')">3</button>
<button class="btn-op" onclick="append('+')">+</button>
<button class="btn-num" onclick="append('0')">0</button>
<button class="btn-num" onclick="append('.')">.</button>
<button class="btn-num" onclick="append('(')">(</button>
<button class="btn-num" onclick="append(')')">)</button>
<button class="btn-func" onclick="append('sin(')">sin</button>
<button class="btn-func" onclick="append('cos(')">cos</button>
<button class="btn-func" onclick="append('tan(')">tan</button>
<button class="btn-eq" onclick="calculate()">=</button>
</div>
</div>
<script>
let exprEl=document.getElementById('expr'),resEl=document.getElementById('res'),currentExpr="";
function append(val){
 if(currentExpr==="0" && !isNaN(val)){currentExpr=val;}else{currentExpr+=val;}
 exprEl.innerText=currentExpr;
}
function clearAll(){currentExpr="";exprEl.innerText="";resEl.innerText="0";}
function del(){currentExpr=currentExpr.slice(0,-1);exprEl.innerText=currentExpr;if(!currentExpr)resEl.innerText="0";}
function calculate(){
 if(!currentExpr) return;
 try{
  let e=currentExpr;
  e=e.replace(/sqrt\(/g,'Math.sqrt(');
  e=e.replace(/sin\(/g,'Math.sin((Math.PI/180)*');
  e=e.replace(/cos\(/g,'Math.cos((Math.PI/180)*');
  e=e.replace(/tan\(/g,'Math.tan((Math.PI/180)*');
  e=e.replace(/cot\(/g,'(1/Math.tan((Math.PI/180)*');
  let result=Number(eval(e));
  if(isNaN(result)) result=0;
  result=parseFloat(result.toFixed(10));
  resEl.innerText=result;
  currentExpr="";
 }catch{resEl.innerText="Error";}
}
setTimeout(()=>{let w=document.getElementById('welcome'); if(w) w.style.display='none'},3000);
</script>
</body>
</html>
