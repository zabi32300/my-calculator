<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZABI PRO CALC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center}
.calc{background:rgba(255,255,255,0.15);backdrop-filter:blur(20px);padding:25px;border-radius:30px;box-shadow:0 20px 40px rgba(0,0,0,0.3);width:320px;border:1px solid rgba(255,255,255,0.3)}
h2{text-align:center;color:white;margin-bottom:15px}
#result{width:100%;height:65px;font-size:30px;text-align:right;padding:15px;border:none;border-radius:15px;background:rgba(0,0,0,0.4);color:white;margin-bottom:15px;outline:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;font-size:20px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.num{background:white;color:#333}
.op{background:#ff9500;color:white}
.eq{background:#34c759;color:white}
.clear{background:#ff3b30;color:white}
button:active{transform:scale(0.9)}
</style>
</head>
<body>
<div class="calc">
<h2>ZABI CALC</h2>
<input id="result" readonly placeholder="0">
<div class="grid">
<button class="clear" onclick="clearResult()">C</button>
<button class="op" onclick="append('/')">÷</button>
<button class="op" onclick="append('*')">×</button>
<button class="op" onclick="append('-')">−</button>
<button class="num" onclick="append('7')">7</button>
<button class="num" onclick="append('8')">8</button>
<button class="num" onclick="append('9')">9</button>
<button class="op" onclick="append('+')">+</button>
<button class="num" onclick="append('4')">4</button>
<button class="num" onclick="append('5')">5</button>
<button class="num" onclick="append('6')">6</button>
<button class="num" onclick="append('1')">1</button>
<button class="num" onclick="append('2')">2</button>
<button class="num" onclick="append('3')">3</button>
<button class="num" onclick="append('0')">0</button>
<button class="num" onclick="append('.')">.</button>
<button class="eq" onclick="calculate()" style="grid-column:span 2">=</button>
</div>
</div>
<script>
function append(v){let r=document.getElementById('result');if(r.value=='Error')r.value='';r.value+=v}
function clearResult(){document.getElementById('result').value=''}
function calculate(){let r=document.getElementById('result');try{r.value=eval(r.value)}catch{r.value='Error'}}
</script>
</body>
</html>
