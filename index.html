<!DOCTYPE html>
<html>
<head>
<title>My Calculator</title>
<style>
body{font-family:Arial;display:flex;justify-content:center;margin-top:50px;background:#f0f0f0}
.calc{background:#fff;padding:20px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
input{width:100%;height:50px;font-size:24px;text-align:right;margin-bottom:10px;padding:5px}
button{width:60px;height:60px;font-size:20px;margin:5px;border:none;border-radius:10px;background:#007bff;color:white;cursor:pointer}
button:hover{background:#0056b3}
</style>
</head>
<body>
<div class="calc">
<input id="result" readonly>
<br>
<button onclick="clearResult()">C</button>
<button onclick="append('/')">/</button>
<button onclick="append('*')">*</button>
<button onclick="append('-')">-</button>
<br>
<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('+')">+</button>
<br>
<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="calculate()">=</button>
<br>
<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('0')">0</button>
</div>
<script>
function append(v){document.getElementById('result').value+=v}
function clearResult(){document.getElementById('result').value=''}
function calculate(){try{document.getElementById('result').value=eval(document.getElementById('result').value)}catch{document.getElementById('result').value='Error'}}
</script>
</body>
</html>
