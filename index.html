<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z CALC DEG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#111;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.calc{width:100%;max-width:380px;background:#1a1a1a;border-radius:20px;padding:15px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.header h2{color:#ffae00;font-size:18px}
.header div button{background:#2a2a2a;border:none;color:#fff;padding:6px 12px;border-radius:20px;margin-left:5px;cursor:pointer}
.display{background:#000;border-radius:12px;padding:15px;text-align:right;margin-bottom:15px;min-height:80px}
#history{font-size:14px;opacity:.5;min-height:18px}
#result{font-size:32px;font-weight:bold;margin-top:5px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button.btn{padding:18px 0;border:none;border-radius:12px;font-size:18px;cursor:pointer;background:#2a2a2a;color:#fff}
button.btn.op{background:#3a3a3a;color:#ffae00}
button.btn.eq{background:#ffae00;color:#000;font-weight:bold}
.sci{display:none}.sci.active{display:grid}
.hist-panel{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;z-index:100;padding:20px;display:none}
.hist-panel.active{display:block}

/* WELCOME SCREEN */
#welcome-screen {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: radial-gradient(circle at center, #222 0%, #000 100%);
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  z-index:9999; transition: opacity 0.8s ease, transform 0.8s ease;
}
#welcome-screen.hide{opacity:0;transform:scale(1.1);pointer-events:none}
.logo{width:80px;height:80px;background:#ffae00;border-radius:20px;display:flex;justify-content:center;align-items:center;font-size:40px;font-weight:bold;color:#000;animation:logoPop 1s ease}
#welcome-screen h1{color:#ffae00;font-size:36px;margin-top:20px;letter-spacing:3px;animation:fadeUp 0.8s ease 0.3s both}
#welcome-screen p{color:#fff;margin-top:8px;letter-spacing:5px;opacity:.6;animation:fadeUp 0.8s ease 0.6s both}
@keyframes logoPop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fadeUp{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
</style>
</head>
<body>

<!-- WELCOME ANIMATION -->
<div id="welcome-screen">
  <div class="logo">Z</div>
  <h1>WELCOME</h1>
  <p>Z CALC DEG</p>
</div>

<div class="calc">
  <div class="header"><h2>Z CALC DEG</h2><div><button onclick="toggleHist()">HIST</button><button onclick="toggleSci()">SCI</button></div></div>
  <div class="display"><div id="history"></div><div id="result">0</div></div>
  <div class="buttons" id="basic">
    <button class="btn op" onclick="clearAll()">C</button><button class="btn op" onclick="backspace()">⌫</button><button class="btn op" onclick="add('%')">%</button><button class="btn op" onclick="add('/')">÷</button>
    <button class="btn" onclick="add('7')">7</button><button class="btn" onclick="add('8')">8</button><button class="btn" onclick="add('9')">9</button><button class="btn op" onclick="add('*')">×</button>
    <button class="btn" onclick="add('4')">4</button><button class="btn" onclick="add('5')">5</button><button class="btn" onclick="add('6')">6</button><button class="btn op" onclick="add('-')">-</button>
    <button class="btn" onclick="add('1')">1</button><button class="btn" onclick="add('2')">2</button><button class="btn" onclick="add('3')">3</button><button class="btn op" onclick="add('+')">+</button>
    <button class="btn" onclick="add('0')">0</button><button class="btn" onclick="add('.')">.</button><button class="btn" onclick="add('(')">(</button><button class="btn eq" onclick="calculate()">=</button>
  </div>
  <div class="buttons sci" id="scientific">
    <button class="btn op" onclick="add('Math.sin(')">sin</button><button class="btn op" onclick="add('Math.cos(')">cos</button><button class="btn op" onclick="add('Math.tan(')">tan</button><button class="btn op" onclick="add('Math.log10(')">log</button>
    <button class="btn op" onclick="add('Math.sqrt(')">√</button><button class="btn op" onclick="add('**')">^</button><button class="btn op" onclick="add('Math.PI')">π</button><button class="btn op" onclick="add('Math.E')">e</button>
  </div>
</div>

<div class="hist-panel" id="histPanel">
  <div style="display:flex;justify-content:space-between"><h3>History</h3><button onclick="toggleHist()" style="background:#ffae00;border:none;padding:6px 15px;border-radius:10px">Close</button></div>
  <div id="histList" style="margin-top:20px"></div>
  <button onclick="clearHist()" style="margin-top:20px;background:#333;color:#fff;border:none;padding:10px;width:100%;border-radius:10px">Clear History</button>
</div>

<script>
let expr="";let historyArr=JSON.parse(localStorage.getItem('z_hist')||"[]");
const resultEl=document.getElementById('result');const histEl=document.getElementById('history');
function add(v){expr+=v;histEl.innerText=expr;resultEl.innerText=expr||"0"}
function clearAll(){expr="";histEl.innerText="";resultEl.innerText="0"}
function backspace(){expr=expr.slice(0,-1);histEl.innerText=expr;resultEl.innerText=expr||"0"}
function calculate(){try{let ev=expr.replace(/%/g,'/100');let res=eval(ev);historyArr.unshift(expr+" = "+res);localStorage.setItem('z_hist',JSON.stringify(historyArr));histEl.innerText=expr+" =";resultEl.innerText=res;expr=res.toString()}catch{resultEl.innerText="Error"}}
function toggleHist(){document.getElementById('histPanel').classList.toggle('active');document.getElementById('histList').innerHTML=historyArr.map(h=>`<div style="padding:10px;border-bottom:1px solid #222">${h}</div>`).join('')||"<p style='opacity:.5'>No history</p>"}
function clearHist(){historyArr=[];localStorage.removeItem('z_hist');toggleHist();toggleHist()}
function toggleSci(){document.getElementById('scientific').classList.toggle('active')}

window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('welcome-screen').classList.add('hide');
  },2200);
});
</script>
</body>
</html>
