<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZABI CALC NEON</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;animation:bg 5s infinite alternate}
@keyframes bg{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(30deg)}}
.box{background:rgba(255,255,255,0.18);backdrop-filter:blur(20px);padding:25px;border-radius:30px;width:330px;box-shadow:0 20px 50px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.3)}
.logo{width:55px;height:55px;background:#ffb700;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#764ba2;box-shadow:0 0 20px #ffb700}
h2{text-align:center;color:white;letter-spacing:3px;text-shadow:0 0 15px white;margin-bottom:15px}
#res{width:100%;height:70px;background:rgba(0,0,0,0.4);border:none;border-radius:15px;color:white;font-size:32px;text-align:right;padding:15px;margin-bottom:18px;outline:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{height:60px;border:none;border-radius:14px;font-size:20px;font-weight:bold;cursor:pointer}
.num{background:white}
.op{background:#ffb700;color:white;box-shadow:0 0 10px #ffb700}
.eq{background:#2ecc71;color:white;grid-column:span 2;box-shadow:0 0 10px #2ecc71}
.cl{background:#ff3b30;color:white}
</style>
</head>
<body>
<div class="box">
<div class="logo">Z</div>
<h2>ZABI CALC</h2>
<input id="res" readonly placeholder="0">
<div class="grid">
<button class="cl" onclick="c()">C</button>
<button class="op" onclick="b()">⌫</button>
<button class="op" onclick="a('/')">÷</button>
<button class="op" onclick="a('*')">×</button>
<button class="num" onclick="a('7')">7</button>
<button class="num" onclick="a('8')">8</button>
<button class="num" onclick="a('9')">9</button>
<button class="op" onclick="a('-')">-</button>
<button class="num" onclick="a('4')">4</button>
<button class="num" onclick="a('5')">5</button>
<button class="num" onclick="a('6')">6</button>
<button class="op" onclick="a('+')">+</button>
<button class="num" onclick="a('1')">1</button>
<button class="num" onclick="a('2')">2</button>
<button class="num" onclick="a('3')">3</button>
<button class="num" onclick="a('0')">0</button>
<button class="num" onclick="a('.')">.</button>
<button class="eq" onclick="e()">=</button>
</div>
</div>
<script>
let r=document.getElementById('res');
function a(v){if(r.value=='Error')r.value='';r.value+=v}
function c(){r.value=''}
function b(){r.value=r.value.slice(0,-1)}
function e(){try{r.value=eval(r.value)}catch{r.value='Error'}}
</script>
</body>
</html>
