<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff88">
 <title>ZOHAIB CALC - NEON DARK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;justify-content:center;align-items:center;transition:0.5s}
body.light{background:linear-gradient(135deg,#667eea,#764ba2,#ff6a88);}

.box{background:rgba(255,255,255,0.1);backdrop-filter:blur(25px);padding:25px;border-radius:30px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(102,126,234,0.3);border:1px solid rgba(255,255,255,0.2);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
body.light .box{background:rgba(255,255,255,0.25);box-shadow:0 20px 50px rgba(0,0,0,0.3)}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{width:50px;height:50px;background:linear-gradient(135deg,#00ff88,#00d4ff);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#000;box-shadow:0 0 20px #00ff88;animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 15px #00ff88}50%{box-shadow:0 0 30px #00ff88, 0 0 50px #00d4ff}}

.theme{width:45px;height:25px;background:rgba(255,255,255,0.2);border-radius:20px;border:none;cursor:pointer;position:relative;color:white;font-size:12px}

h2{text-align:center;color:white;letter-spacing:4px;text-shadow:0 0 15px #00ff88, 0 0 30px #00ff88;margin-bottom:5px;animation:textGlow 2s infinite alternate}
@keyframes textGlow{from{text-shadow:0 0 10px #00ff88}to{text-shadow:0 0 20px #00ff88, 0 0 40px #00d4ff}}
.sub{text-align:center;color:rgba(255,255,255,0.6);font-size:10px;letter-spacing:2px;margin-bottom:15px}

#res{width:100%;height:70px;background:rgba(0,0,0,0.5);border:none;border-radius:15px;color:#00ff88;font-size:34px;text-align:right;padding:15px;margin-bottom:18px;outline:none;box-shadow:inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(0,255,136,0.2);text-shadow:0 0 10px #00ff88}
body.light #res{background:rgba(0,0,0,0.35);color:white;text-shadow:none}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{height:60px;border:none;border-radius:14px;font-size:20px;font-weight:bold;cursor:pointer;transition:0.2s}
button:active{transform:scale(0.9)}
.num{background:rgba(255,255,255,0.9);color:#111}
.num:hover{box-shadow:0 0 20px white;transform:translateY(-2px)}
.op{background:linear-gradient(135deg,#ffcc00,#ff9500);color:white;box-shadow:0 0 12px #ffcc00}
.op:hover{box-shadow:0 0 25px #ffcc00;transform:translateY(-2px)}
.eq{background:linear-gradient(135deg,#00ff88,#00d4aa);color:#000;grid-column:span 3;box-shadow:0 0 15px #00ff88}
.eq:hover{box-shadow:0 0 30px #00ff88}
.cl{background:linear-gradient(135deg,#ff3b30,#ff5e5e);color:white;box-shadow:0 0 12px #ff3b30}
</style>
</head>
<body class="dark">
<div class="box">
<div class="top">
<div class="logo">Z</div>
<button class="theme" onclick="toggleTheme()" id="tBtn">☀️</button>
</div>
<h2>ZOHAIB</h2>
<p class="sub">NEON DARK EDITION</p>
<input id="res" readonly placeholder="0">
<div class="grid">
<button class="cl" onclick="c()">C</button>
<button class="op" onclick="b()">⌫</button>
<button class="op" onclick="a('/')">÷</button>
<button class="op" onclick="a('*')">×</button>
<button class="num" onclick="a('7')">7</button>
<button class="num" onclick="a('8')">8</button>
<button class="num" onclick="a('9')">9</button>
<button class="op" onclick="a('-')">−</button>
<button class="num" onclick="a('4')">4</button>
<button class="num" onclick="a('5')">5</button>
<button class="num" onclick="a('6')">6</button>
<button class="op" onclick="a('+')">+</button>
<button class="num" onclick="a('1')">1</button>
<button class="num" onclick="a('2')">2</button>
<button class="num" onclick="a('3')">3</button>
<button class="num" onclick="a('0')">0</button>
<button class="num" onclick="a('.')">.</button>
<button class="eq" onclick="e()">=</button>
</div>
</div>
<script>
let r=document.getElementById('res');
let dark=true;
function a(v){if(r.value=='Error')r.value='';r.value+=v; r.style.boxShadow='0 0 25px #00ff88'; setTimeout(()=>r.style.boxShadow='',200)}
function c(){r.value=''}
function b(){r.value=r.value.slice(0,-1)}
function e(){try{r.value=eval(r.value); r.style.boxShadow='0 0 30px #00ff88'; setTimeout(()=>r.style.boxShadow='',400)}catch{r.value='Error'}}
function toggleTheme(){
 dark=!dark;
 document.body.classList.toggle('light',!dark);
 document.getElementById('tBtn').innerText=dark?'☀️':'🌙';
}
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
