<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZABI PRO CALC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center}
.box{background:rgba(255,255,255,0.2);backdrop-filter:blur(20px);padding:25px;border-radius:30px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.4)}
h2{text-align:center;color:white;letter-spacing:3px;text-shadow:0 0 15px white;margin-bottom:15px}
#res{width:100%;height:70px;background:rgba(0,0,0,0.35);border:none;border-radius:15px;color:white;font-size:32px;text-align:right;padding:15px;margin-bottom:18px;outline:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{height:60px;border:none;border-radius:14px;font-size:22px;font-weight:bold;cursor:pointer}
.num{background:white;color:#333}
.op{background:#ffb700;color:white}
.cl{background:#ff3b30;color:white}
.eq{background:#2ecc71;color:white;grid-column:span 2}
button:active{transform:scale(0.92)}
</style>
</head>
<body>
<div class="box">
<h2>ZABI CALC</h2>
<input id="res" readonly placeholder="0">
<div class="grid">
<button class="cl" onclick="c()">C</button>
<button class="op" onclick="b()">⌫</button>
<button class="op" onclick="a('/')">÷</button>
<button class="op" onclick="a('*')">×</button>

<button class="num" onclick="a('7')">7</button>
<button class="num" onclick="a('8')">8</button>
<button class="num" onclick="a('9')">9</button>
<button class="op" onclick="a('-')">−</button>

<button class="num" onclick="a('4')">4</button>
<button class="num" onclick="a('5')">5</button>
<button class="num" onclick="a('6')">6</button>
<button class="op" onclick="a('+')">+</button>

<button class="num" onclick="a('1')">1</button>
<button class="num" onclick="a('2')">2</button>
<button class="num" onclick="a('3')">3</button>
<button class="num" onclick="a('0')">0</button>

<button class="num" onclick="a('.')">.</button>
<button class="eq" onclick="e()">=</button>
<button class="num" style="visibility:hidden"></button>
</div>
</div>
<script>
let r=document.getElementById('res');
function a(v){if(r.value=='Error')r.value='';r.value+=v}
function c(){r.value=''}
function b(){r.value=r.value.slice(0,-1)}
function e(){try{r.value=eval(r.value)}catch{r.value='Error'}}
</script>
</body>
</html>
