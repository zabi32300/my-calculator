<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z CALC - Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#1a1a2e;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}
.calc{width:100%;max-width:380px;background:#222;padding:15px;border-radius:20px;position:relative}
.top{color:#fff;display:flex;justify-content:space-between;align-items:center}
.top b{letter-spacing:1px}
.top div{display:flex;gap:6px}
.top button{padding:6px 10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.display{background:#000;color:#fff;padding:14px;border-radius:12px;text-align:right;min-height:75px;margin:12px 0;overflow:hidden}
#frac{font-size:11px;color:#2ecc71;min-height:12px}
#mini{font-size:11px;color:#aaa;min-height:12px;word-break:break-all}
#res{font-size:30px;word-break:break-all}
.hist{display:none;background:#111;border-radius:10px;padding:10px;margin-bottom:10px;max-height:200px;overflow:auto}
.hist.show{display:block}
.hist h4{color:#fff;font-size:12px;display:flex;justify-content:space-between}
.hist-item{color:#ddd;font-size:12px;padding:5px 0;border-bottom:1px solid #333;display:flex;justify-content:space-between}
.hist-item span:last-child{color:#0af}
.sci{display:none;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.calc.showSci .sci{display:grid}
.sci button{padding:12px;background:#444;color:#fff;border:none;border-radius:8px}
.basic{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{height:52px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px}
.num{background:#eee}.op{background:orange;color:#fff}.clear{background:#ff3b30;color:#fff}.eq{background:#0af;color:#fff;grid-column:span 2}.sd{background:orange;color:#fff}
</style>
</head>
<body>
<div class="calc" id="calcBox">
<div class="top"><b>Z CALC DEG</b><div><button onclick="toggleHist()">HIST</button><button onclick="document.getElementById('calcBox').classList.toggle('showSci')">SCI</button></div></div>
<div class="display"><div id="frac"></div><div id="mini"></div><div id="res">0</div></div>
<div class="hist" id="histBox"><h4><span>History</span><span onclick="clearHist()" style="color:#f55;cursor:pointer">Clear</span></h4><div id="histList"></div></div>
<div class="sci">
<button onclick="add('sin(')">sin</button><button onclick="add('cos(')">cos</button><button onclick="add('tan(')">tan</button><button onclick="add('(')">(</button>
<button onclick="add(')')">)</button><button onclick="add('sqrt(')">√</button><button onclick="add('PI')">π</button><button onclick="add('^')">^</button>
</div>
<div class="basic">
<button class="btn clear" onclick="clr()">AC</button><button class="btn" onclick="bk()">⌫</button><button class="btn sd" onclick="toggleSD()">S⇔D</button><button class="btn op" onclick="add('/')">÷</button>
<button class="btn num" onclick="add('7')">7</button><button class="btn num" onclick="add('8')">8</button><button class="btn num" onclick="add('9')">9</button><button class="btn op" onclick="add('*')">×</button>
<button class="btn num" onclick="add('4')">4</button><button class="btn num" onclick="add('5')">5</button><button class="btn num" onclick="add('6')">6</button><button class="btn op" onclick="add('-')">−</button>
<button class="btn num" onclick="add('1')">1</button><button class="btn num" onclick="add('2')">2</button><button class="btn num" onclick="add('3')">3</button><button class="btn op" onclick="add('+')">+</button>
<button class="btn num" onclick="add('0')">0</button><button class="btn num" onclick="add('.')">.</button><button class="btn eq" onclick="calc()">=</button>
</div>
</div>
<script>
let disp='', lastDec=null, lastFrac=null, showFrac=false;
let historyArr = JSON.parse(localStorage.getItem('zcalcHist')||'[]');
const res=document.getElementById('res'), mini=document.getElementById('mini'), fracEl=document.getElementById('frac'), histList=document.getElementById('histList'), histBox=document.getElementById('histBox');

function toFrac(x){
 if(Math.abs(x-0.5)<1e-9) return "1/2";
 if(Math.abs(x+0.5)<1e-9) return "-1/2";
 if(Math.abs(x-0.333333333)<1e-4) return "1/3";
 if(Math.abs(x-0.25)<1e-9) return "1/4";
 if(Math.abs(x-0.86602540378)<1e-4) return "√3/2";
 if(Math.abs(x-0.70710678118)<1e-4) return "√2/2";
 if(Math.abs(x-1.414213562)<1e-4) return "√2";
 if(Math.abs(x-1.732050807)<1e-4) return "√3";
 return null;
}
function add(t){ disp+=t; mini.textContent=disp; res.textContent=disp.slice(-15)||'0'; fracEl.textContent=''; }
function clr(){ disp=''; res.textContent='0'; mini.textContent=''; fracEl.textContent=''; lastDec=null; }
function bk(){ disp=disp.slice(0,-1); mini.textContent=disp; res.textContent=disp||'0'; }
function renderHist(){
 histList.innerHTML='';
 historyArr.slice().reverse().forEach(h=>{
   let d=document.createElement('div'); d.className='hist-item';
   d.innerHTML='<span>'+h.q+'</span><span>'+h.a+'</span>';
   d.onclick=()=>{ disp=h.q; mini.textContent=h.q; res.textContent=h.a; };
   histList.appendChild(d);
 });
}
function saveHist(q,a){ historyArr.push({q,a}); if(historyArr.length>30) historyArr.shift(); localStorage.setItem('zcalcHist', JSON.stringify(historyArr)); renderHist(); }
function toggleHist(){ histBox.classList.toggle('show'); renderHist(); }
function clearHist(){ historyArr=[]; localStorage.removeItem('zcalcHist'); renderHist(); }
function calc(){
 try{
  let expr = disp.replace(/PI/g, 'Math.PI').replace(/sqrt\(/g,'Math.sqrt(').replace(/\^/g,'**');
  expr = expr.replace(/sin\(/g,'Math.sin((Math.PI/180)*').replace(/cos\(/g,'Math.cos((Math.PI/180)*').replace(/tan\(/g,'Math.tan((Math.PI/180)*');
  let v = Function('return ('+expr+')')();
  v = Math.round(v*1e9)/1e9;
  lastDec=v; lastFrac=toFrac(v);
  let out = lastFrac ? lastFrac : v;
  if(lastFrac){ res.textContent=lastFrac; fracEl.textContent='= '+v+'  (S⇔D)'; showFrac=true; }
  else{ res.textContent=v; fracEl.textContent=''; showFrac=false; }
  mini.textContent=disp+' = '+out;
  saveHist(disp, out);
  disp=v.toString();
 }catch(e){ res.textContent='Error'; console.log(e); }
}
function toggleSD(){
 if(lastDec==null) return;
 if(showFrac){ res.textContent=lastDec; fracEl.textContent=lastFrac; showFrac=false; }
 else{ if(lastFrac){ res.textContent=lastFrac; fracEl.textContent='= '+lastDec; showFrac=true; } }
}
renderHist();
</script>
</body>
</html>
